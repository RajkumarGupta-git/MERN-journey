<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Contact Form & Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-card">
            <div class="icon-box">
                <i class="fa-solid fa-paper-plane"></i>
            </div>

            <h1>Contact Us</h1>
            <p class="subtitle"> We'd love to hear from you. Fill out the form below and we'll get back to you soon.</p>


            <form id="contactForm" onsubmit="return validateForm()">


                <div class="input-group">

                    <label>Full Name</label>

                    <div class="input-field">
                        <i class="fa-solid fa-user"></i>

                        <input 
                            type="text"
                            id="contact-name"
                            placeholder="Amit Gupt">
                    </div>
                    <span id="name-error"></span>

                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <div class="input-field">

                        <i class="fa-solid fa-phone"></i>
                        <input
                            type="tel"
                            id="contact-phone"
                            placeholder="7756332639">

                    </div>
                    <span id="phone-error"></span>
                </div>


                <div class="input-group">
                    <label>Email Address</label>

                    <div class="input-field">
                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="contact-email"
                            placeholder="example@email.com">

                    </div>

                    <span id="email-error"></span>
                </div>
                <div class="input-group">
                    <label>Message</label>
                    <div class="input-field textarea-field">
                        <i class="fa-solid fa-comment"></i>
                        <textarea
                            id="contact-message"
                            placeholder =" Write your message..."> </textarea>
                    </div>
                    <span id="message-error"></span>
                </div>
                <button type="submit" id="submitBtn">
                    <span>Send Message</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
                <span id="submit-error"></span>

            </form>
        </div>
    </div>


    <!-- EmailJS Integrate  -->

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>

        emailjs.init({
            publicKey: "4oXp1D7rn8aeVuNI0"
        });

    </script>
    <script src="app.js"></script>
</body>
</html>
